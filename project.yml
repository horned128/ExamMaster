        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: MyApp.swift
      - path: ContentView.swift
      - path: Core
      - path: Ads
      - path: Views
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
      - path: ${privacyPolicyPath}
        buildPhase: resources
      - path: Qualifications/${qualificationID}/products.storekit
        buildPhase: none
      - path: Qualifications/${qualificationID}/qualification.json
      - path: Qualifications/${qualificationID}/questions.json
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    preBuildScripts:
      - name: Generate qualification icon
        script: >-
          xcrun --sdk macosx swift "${SRCROOT}/tools/GenerateIcon.swift"
          "${SRCROOT}/Qualifications/${qualificationID}/qualification.json"
          "${SRCROOT}/Assets.xcassets/${iconName}.appiconset/AppIcon.png"
        inputFiles:
          - $(SRCROOT)/tools/GenerateIcon.swift
          - $(SRCROOT)/Qualifications/${qualificationID}/qualification.json
          - $(SRCROOT)/design-system/exammaster/mascot/chicken-face.json
        outputFiles:
          - $(SRCROOT)/Assets.xcassets/${iconName}.appiconset/AppIcon.png
    settings:
      base:
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: ${iconName}
        PRODUCT_BUNDLE_IDENTIFIER: ${bundleID}
        PRODUCT_NAME: ${target_name}
        ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ExamMaster:
    templates: [QualificationApp]
    templateAttributes:
      qualificationID: demo-safety
      privacyPolicyPath: PrivacyPolicy.txt
      displayName: 設備安全学習
      bundleID: jp.example.exammaster.demo
      iconName: AppIcon
      adMobAppID: ca-app-pub-3940256099942544~1458002511
    settings:
      base:
        CODE_SIGN_IDENTITY: iPhone Developer
        DEVELOPMENT_TEAM: QZH83KGFVX
    scheme:
      testTargets: [ExamMasterTests, ExamMasterUITests]
      storeKitConfiguration: Qualifications/demo-safety/products.storekit
  ExamMasterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Qualifications/demo-safety/products.storekit
    dependencies:
      - target: ExamMaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.exammaster.tests
  NetworkSpecialist:
    templates: [QualificationApp]
    templateAttributes:
      qualificationID: network-specialist
      privacyPolicyPath: Qualifications/network-specialist/PrivacyPolicy.txt
      displayName: ピヨトレ！ネットワークスペシャリスト
      bundleID: jp.hino.piyotre.networkspecialist
      iconName: NetworkSpecialistIcon
      adMobAppID: ca-app-pub-9785585722959806~8954413240
    settings:
      base:
        CURRENT_PROJECT_VERSION: '2'
        CODE_SIGN_IDENTITY: iPhone Developer
        DEVELOPMENT_TEAM: QZH83KGFVX
    sources:
      - path: Qualifications/network-specialist/Figures
        type: folder
        buildPhase: resources
    scheme:
      testTargets: [NetworkSpecialistTests, NetworkSpecialistUITests]
      storeKitConfiguration: Qualifications/network-specialist/products.storekit
  NetworkSpecialistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NetworkTests
      - path: Qualifications/network-specialist/products.storekit
    dependencies:
      - target: NetworkSpecialist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.exammaster.networkspecialist.tests
  NetworkSpecialistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NetworkUITests
      - path: Qualifications/network-specialist/products.storekit
    dependencies:
      - target: NetworkSpecialist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.exammaster.networkspecialist.uitests
  ExamMasterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ExamMaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.exammaster.uitests
