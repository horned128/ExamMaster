name: ExamMaster
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ''
targetTemplates:
  QualificationApp:
    type: application
    platform: iOS
    info:
      path: Config/${target_name}-Info.plist
      properties:
        QualificationID: ${qualificationID}
        CFBundleDisplayName: ${displayName}
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
    sources:
      - path: MyApp.swift
      - path: ContentView.swift
      - path: Core
      - path: Views
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
      - path: Qualifications/${qualificationID}/products.storekit
        buildPhase: none
      - path: Qualifications/${qualificationID}/qualification.json
      - path: Qualifications/${qualificationID}/questions.json
    settings:
      base:
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: ${iconName}
        PRODUCT_BUNDLE_IDENTIFIER: ${bundleID}
        PRODUCT_NAME: ${target_name}
targets:
  ExamMaster:
    templates: [QualificationApp]
    templateAttributes:
      qualificationID: demo-safety
      displayName: 設備安全学習
      bundleID: jp.example.exammaster.demo
      iconName: AppIcon
    scheme:
      testTargets: [ExamMasterTests, ExamMasterUITests]
      storeKitConfiguration: Qualifications/demo-safety/products.storekit
  HarborStudy:
    templates: [QualificationApp]
    templateAttributes:
      qualificationID: harbor-record
      displayName: 港湾記録学習
      bundleID: jp.example.exammaster.harbor
      iconName: HarborIcon
    scheme:
      storeKitConfiguration: Qualifications/harbor-record/products.storekit
  ExamMasterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Qualifications/demo-safety/products.storekit
      - path: Qualifications/harbor-record
        type: folder
    dependencies:
      - target: ExamMaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.exammaster.tests
  ExamMasterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ExamMaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.exammaster.uitests
